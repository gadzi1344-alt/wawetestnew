<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wave</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wave">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<style>
  :root{
    --bg:#0a0a0a; --side:#0e0e0e; --surface:#151515; --surface2:#1d1d1d; --line:#202020;
    --txt:#ededed; --muted:#8c8c8c; --dim:#5a5a5a;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit;color:inherit}

  .app{flex:1;min-height:0;display:grid;grid-template-columns:110px 1fr;position:relative}

  /* ---------- Sidebar ---------- */
  aside{position:absolute;left:12px;top:12px;bottom:12px;width:76px;z-index:15;display:flex;flex-direction:column;gap:2px;padding:26px 0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;background:transparent;transition:width .5s var(--ease)}
  aside::-webkit-scrollbar{display:none}
  aside:hover{width:240px}
  aside:hover .nav{box-shadow:0 30px 70px #000b}
  .brand{font-weight:800;font-size:19px;letter-spacing:-.4px;padding:2px 12px 26px}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;text-align:left;transition:background .25s var(--ease),color .25s}
  .nav button:hover{color:var(--txt);background:var(--surface)}
  .nav button.active{color:var(--txt);background:var(--surface2)}
  .nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .nav{margin:auto 0;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:40px;background:var(--side);border:1px solid var(--line);box-shadow:0 20px 50px #0007;transition:box-shadow .4s}
  .nav button{position:relative}
  .nav button.active::before{content:"";position:absolute;left:-14px;top:24%;bottom:24%;width:3px;border-radius:0 3px 3px 0;background:var(--txt)}
  .nav button svg{transition:transform .25s var(--ease)}
  .nav button:hover svg{transform:translateX(2px)}
  .nav button{color:#c4c4c4}
  .nav button svg{stroke-width:1.9;opacity:.9}
  .nav button:hover{color:#fff}
  .nav button.active{color:#fff}
  .nav button.active svg{opacity:1}
  .nav button{border-radius:999px}
  aside:not(:hover) .nav button{width:46px;height:46px;margin:0 auto;padding:0;border-radius:50%;justify-content:center;gap:0}
  aside:not(:hover) .nav button.active{background:#ffffff1c}
  .nav button.active{background:#ffffff1c}

  /* Плейлисты: название всегда в одну строку с многоточием, без вылезания за капсулу */
  .pl-wrap{min-width:0;width:100%}
  #plList{min-width:0}
  #plList button{display:block;width:100%;min-width:0;max-width:100%;padding:9px 14px;border-radius:999px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-sizing:border-box}
  #plList button.active{background:#ffffff1c;color:#fff}
  .nav button.active::before{display:none}

  /* Подписи плавно выезжают при наведении, в свёрнутом виде скрыты */
  .nav span{display:inline-block;max-width:160px;overflow:hidden;white-space:nowrap;opacity:1;transform:translateX(0);transition:max-width .5s var(--ease),opacity .3s,transform .4s var(--ease)}
  aside:not(:hover) .nav span{max-width:0;opacity:0;transform:translateX(-10px)}
  aside:hover .nav span{transition-delay:.12s}
  .nav button{transition:background .25s,color .25s,gap .4s var(--ease),padding .4s var(--ease)}
  aside:not(:hover) .nav button{gap:0;padding:12px 20px}

  .brand{display:flex;align-items:baseline;white-space:nowrap;overflow:hidden;padding:2px 12px 26px}
  .brand b{font-size:21px;font-weight:900;letter-spacing:-.4px;color:#fff}
  .brand span{font-size:19px;font-weight:800;letter-spacing:-.4px;max-width:140px;overflow:hidden;opacity:1;transition:max-width .5s var(--ease),opacity .3s}
  aside:not(:hover) .brand{justify-content:center;padding:2px 0 26px}
  aside:not(:hover) .brand span{max-width:0;opacity:0}

  .label,#plList{transition:opacity .3s,visibility .3s}
  aside:not(:hover) .label,aside:not(:hover) #plList{opacity:0;visibility:hidden}
  aside:hover .label,aside:hover #plList{transition-delay:.15s}
  .label{display:flex;justify-content:space-between;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);padding:24px 12px 8px}
  .plus{width:24px;height:24px;border-radius:7px;color:var(--muted);font-size:18px;line-height:1;display:grid;place-items:center;transition:.2s}
  .plus:hover{color:var(--txt);background:var(--surface)}
  #plList button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:9px;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .2s,color .2s}
  #plList button:hover{color:var(--txt);background:var(--surface)}
  #plList button.active{color:var(--txt);background:var(--surface2)}
  #plList .empty{color:var(--dim);font-size:13px;padding:6px 12px}

  /* ---------- Main ---------- */
  main{grid-column:2;overflow-y:auto;padding:28px 44px 40px;min-width:0}
  .search{position:relative;max-width:460px;width:100%;margin:0 auto 34px}
  .search input{cursor:pointer}
  .search input{width:100%;padding:12px 16px 12px 42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;outline:none;transition:border-color .25s}
  .search input::placeholder{color:var(--dim)}
  .search input:focus{border-color:#333}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}

  #content{animation:enter .5s var(--ease) both}
  @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .hero{padding:4px 0 34px}
  .hero h1{font-size:44px;font-weight:800;letter-spacing:-1.2px;line-height:1.05}
  .hero p{color:var(--muted);margin:10px 0 22px;font-size:15px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;background:var(--txt);color:#000;font-weight:600;font-size:14px;transition:transform .25s var(--ease),opacity .25s}
  .btn:hover{transform:translateY(-1px);opacity:.9}
  .btn:disabled{opacity:.35;pointer-events:none}
  .btn.ghost{background:var(--surface2);color:var(--txt)}
  .btn.danger{background:transparent;color:#d97070;border:1px solid #3a2222}
  .btn svg{width:14px;height:14px;fill:currentColor}

  .ph{display:flex;align-items:flex-end;gap:22px;margin-bottom:26px}
  .ph h2{font-size:26px;font-weight:800;letter-spacing:-.6px}
  .ph .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-bottom:6px}
  .ph .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .ph .cover,.ph .avatar{width:156px;height:156px;background:var(--surface2) center/cover;flex:none;box-shadow:0 24px 50px #0009;animation:pop .6s var(--ease) both}
  .ph .cover{border-radius:14px}
  .ph .avatar{border-radius:50%}
  .ph .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .section{font-size:16px;font-weight:700;margin:4px 0 14px;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:13px}

  /* ---------- Track rows ---------- */
  .list{display:flex;flex-direction:column;gap:2px}
  .row{position:relative;display:grid;grid-template-columns:44px 1fr auto 66px;gap:14px;align-items:center;padding:7px 10px;border-radius:10px;cursor:pointer;transition:background .2s var(--ease);animation:rise .5s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row:hover{background:var(--surface)}
  .thumb{position:relative;width:44px;height:44px;border-radius:8px;background:var(--surface2) center/cover;overflow:hidden;flex:none}
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;opacity:0;transition:opacity .2s}
  .ov svg{width:16px;height:16px;fill:#fff}
  .row:hover .ov{opacity:1}
  .eq{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:3px;background:#000a}
  .eq span{width:3px;height:16px;border-radius:2px;background:#fff;animation:eq .9s ease-in-out infinite alternate}
  .eq span:nth-child(2){animation-delay:-.3s}
  .eq span:nth-child(3){animation-delay:-.6s}
  @keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
  .row.playing .eq{display:flex}
  .row.playing .ov{display:none}
  .paused .eq span{animation-play-state:paused}
  .meta{min-width:0}
  .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e4e4e4}
  .row.playing .t{color:#fff}
  .a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .link{cursor:pointer;transition:color .2s}
  .link:hover{color:#fff;text-decoration:underline;text-underline-offset:3px}
  .dur{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
  .act button{width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:18px;line-height:1;opacity:0;transition:opacity .2s,background .2s,color .2s}
  .row:hover .act button{opacity:1}
  .act button:hover{background:var(--surface2);color:var(--txt)}

  /* ---------- Player bar ---------- */
  .player{flex:none;height:96px;border-top:1px solid var(--line);background:#0c0c0c;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:0 24px}
  .np{display:flex;align-items:center;gap:12px;min-width:0}
  .np .t,.np .a{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .np .t{font-size:14px}
  .center{display:flex;align-items:center;gap:20px}
  .mini{width:48px;height:48px;border-radius:10px;background:var(--surface2) center/cover;flex:none;transition:background-image .4s}
  .ctrl{display:flex;flex-direction:column;gap:8px;width:min(400px,40vw)}
  .btns{display:flex;align-items:center;justify-content:center;gap:18px}
  .btns button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:color .2s,transform .2s var(--ease)}
  .btns button:hover{color:var(--txt)}
  .btns button svg{width:18px;height:18px;fill:currentColor}
  .btns .main{width:36px;height:36px;background:var(--txt);color:#000}
  .btns .main:hover{color:#000;transform:scale(1.06)}
  .btns .main svg{width:15px;height:15px}
  .bar{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .bar input{flex:1}
  .vol{justify-self:end;display:flex;align-items:center;gap:10px;color:var(--muted)}
  .vol svg{width:16px;height:16px;fill:currentColor}
  input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;outline:none;cursor:pointer;background:linear-gradient(var(--txt),var(--txt)) 0/var(--p,0%) 100% no-repeat #2c2c2c}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#fff;opacity:0;transition:opacity .2s}
  input[type=range]:hover::-webkit-slider-thumb{opacity:1}
  input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:#fff}
  #seek{flex:1}
  #vol{width:110px;flex:none}

  /* ---------- Popover / modal / toast ---------- */
  .pop{position:fixed;z-index:20;min-width:230px;max-height:300px;overflow-y:auto;background:var(--surface2);border:1px solid #2a2a2a;border-radius:12px;padding:6px;box-shadow:0 18px 40px #000b;animation:pop .2s var(--ease) both}
  .pop button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:14px;color:#ddd}
  .pop button:hover{background:#2a2a2a;color:#fff}
  .pop button span{color:var(--dim);font-size:12px}
  .pop .new{color:var(--muted);border-top:1px solid #2a2a2a;border-radius:0 0 8px 8px;margin-top:4px;padding-top:11px}
  .pop .empty{color:var(--dim);font-size:13px;padding:9px 10px}

  .modal-bg{position:fixed;inset:0;z-index:30;background:#000a;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-bg.open{display:flex;animation:enter .25s var(--ease) both}
  .modal{width:min(380px,100%);background:var(--surface);border:1px solid #2a2a2a;border-radius:16px;padding:24px;animation:pop .3s var(--ease) both}
  .modal h3{font-size:17px;font-weight:700;margin-bottom:16px}
  .modal input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:none;font-size:14px}
  .modal input:focus{border-color:#3a3a3a}
  .mbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

  .toast{position:fixed;top:18px;right:18px;z-index:40;max-width:340px;background:var(--surface2);border:1px solid #2a2a2a;padding:12px 16px;border-radius:12px;font-size:13px;color:#e6e6e6;box-shadow:0 12px 30px #0008;display:none;animation:pop .3s var(--ease) both}

  /* ---------- Библиотека ---------- */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px}
  .pcard{display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0;animation:rise .5s var(--ease) both;transition:transform .35s var(--ease)}
  .pcard:hover{transform:translateY(-4px)}
  .pc-cover{width:100%;aspect-ratio:1;border-radius:16px;background:var(--surface2) center/cover;box-shadow:0 14px 30px #0008}
  .pc-cover.heart-card{display:grid;place-items:center;background:linear-gradient(135deg,#2b1a20,#121212)}
  .pc-cover.heart-card svg{width:48px;height:48px;fill:#f25f7a}
  .pc-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pc-sub{font-size:12px;color:var(--muted)}
  .tabbar{display:none}
  aside .pl-wrap{display:none !important}

  /* ---------- Полноэкранный поиск ---------- */
  .sx{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility .35s}
  .sx.open{opacity:1;visibility:visible}
  .sx-bg{position:absolute;inset:0;background:#0a0a0af2;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .sx-close{position:absolute;top:22px;right:24px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--txt);background:#ffffff14;transition:background .2s,transform .3s var(--ease)}
  .sx-close:hover{background:#ffffff26;transform:rotate(90deg)}
  .sx-close svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .sx-inner{position:relative;width:min(640px,100%);transform:translateY(-28px) scale(.96);opacity:0;transition:transform .55s var(--ease),opacity .45s var(--ease)}
  .sx.open .sx-inner{transform:none;opacity:1}
  .sx-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin-bottom:12px}
  #sxInput{width:100%;background:transparent;border:0;border-bottom:1px solid #2e2e2e;padding:14px 4px;color:var(--txt);font-size:clamp(24px,4vw,36px);font-weight:700;letter-spacing:-.5px;outline:none;transition:border-color .3s}
  #sxInput:focus{border-color:#fff}
  #sxInput::placeholder{color:#3d3d3d}
  .sx-hint{margin-top:16px;font-size:12px;color:var(--dim)}

  /* ---------- Плейлисты и избранное внутри капсулы ---------- */
  .pl-wrap{overflow:hidden;max-height:0;opacity:0;transition:max-height .5s var(--ease),opacity .3s}
  aside:hover .pl-wrap{max-height:560px;opacity:1;transition-delay:.12s}
  .pl-wrap .label{padding:18px 12px 8px}
  #content,#body,.list{width:100%}

  /* ---------- Лайки ---------- */
  .act{display:flex;gap:2px;justify-content:flex-end;align-items:center}
  .act svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;pointer-events:none}
  .act .like.on{opacity:1;color:#f25f7a}
  .act .like.on svg{fill:currentColor}
  .full .like{margin-top:14px;width:46px;height:46px;border-radius:50%;background:#ffffff14;display:inline-grid;place-items:center;color:var(--txt);transition:background .2s,transform .25s var(--ease)}
  .full .like:hover{background:#ffffff26;transform:scale(1.06)}
  .full .like svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
  .full .like.on{color:#f25f7a}
  .full .like.on svg{fill:currentColor}

  /* ---------- Обложка плейлиста ---------- */
  .ph .cover{position:relative;overflow:hidden;cursor:pointer}
  .ph .cover::after{content:"Изменить фото";position:absolute;left:0;right:0;bottom:0;padding:9px;text-align:center;font-size:12px;font-weight:600;color:#fff;background:#000b;opacity:0;transition:opacity .25s}
  .ph .cover:hover::after{opacity:1}
  .ph .cover.heart{display:grid;place-items:center;cursor:default;background:linear-gradient(135deg,#2b1a20,#121212)}
  .ph .cover.heart::after{display:none}
  .ph .cover.heart svg{width:64px;height:64px;fill:#f25f7a}

  /* ---------- Номера в чартах ---------- */
  .list.chart .row{grid-template-columns:34px 44px 1fr auto 66px}
  .rank{font-size:18px;font-weight:800;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .rank.top{color:#fff;font-size:22px}

  /* ---------- Полноэкранный плеер ---------- */
  .lyr-btn{position:absolute;top:22px;right:24px;height:42px;padding:0 18px;border-radius:999px;background:#ffffff14;color:var(--txt);font-size:13px;font-weight:600;transition:background .2s,color .2s}
  .lyr-btn:hover{background:#ffffff26}
  .lyr-btn.on{background:var(--txt);color:#000}
  .full.lyr .big{display:none}
  .lyrics{display:none;position:relative;width:100%;height:min(380px,50vh);overflow-y:auto;text-align:center;padding:40px 0;scroll-behavior:smooth;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);scrollbar-width:none}
  .lyrics::-webkit-scrollbar{display:none}
  .full.lyr .lyrics{display:block}
  .lyrics p{font-size:21px;font-weight:700;line-height:1.45;color:#ffffff38;padding:8px 0;cursor:pointer;transition:color .35s,transform .35s var(--ease)}
  .lyrics p.past{color:#ffffff75}
  .lyrics p.on{color:#fff;transform:scale(1.04)}
  .lyrics p:hover{color:#ffffff99}
  .lyrics .msg{font-size:15px;color:var(--muted);padding-top:120px;font-weight:500}
  .mini,.np{cursor:pointer}
  .mini{transition:transform .3s var(--ease)}
  .mini:hover{transform:scale(1.05)}

  .full{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:40px 24px;overflow:hidden;background:var(--bg);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s var(--ease),visibility .45s}
  .full.open{opacity:1;visibility:visible;pointer-events:auto}
  .full .bgimg{position:absolute;inset:-8%;background:center/cover;filter:blur(55px) saturate(1.4);transform:scale(1.1);transition:background-image .6s}
  .full .shade{position:absolute;inset:0;background:linear-gradient(180deg,#0a0a0acc 0%,#0a0a0af0 100%)}
  .full .close{position:absolute;top:22px;left:24px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--txt);background:#ffffff14;transition:background .2s,transform .25s var(--ease)}
  .full .close:hover{background:#ffffff26;transform:scale(1.06)}
  .full .close svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .full .inner{position:relative;width:min(440px,100%);display:flex;flex-direction:column;align-items:center;gap:28px;transform:translateY(40px) scale(.97);opacity:0;transition:transform .6s var(--ease),opacity .5s var(--ease)}
  .full.open .inner{transform:none;opacity:1}
  .full .big{width:min(380px,62vh,80vw);height:min(380px,62vh,80vw);border-radius:22px;background:var(--surface2) center/cover;box-shadow:0 40px 90px #000d;transition:transform .6s var(--ease);animation:bigIn .8s var(--ease) backwards}
  .full.paused .big{transform:scale(.92)}
  @keyframes bigIn{from{opacity:0;transform:scale(.82) translateY(20px)}to{opacity:1;transform:none}}

  /* ---------- Mobile ---------- */
  @media (max-width:760px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}

    aside:not(:hover) #plList{opacity:1;visibility:visible}

    #plList{display:flex;gap:6px}

    .pl-wrap{max-height:none;opacity:1;overflow:visible;display:flex;gap:6px;align-items:center}
    main{grid-column:1;padding:20px 16px 30px}
    .player{grid-template-columns:1fr;height:auto;padding:12px 16px;gap:10px}
    .np{order:1}

    .mini{display:none}
    .ctrl{width:100%}
    .vol{display:none}
    .act button{opacity:1}

    .full .btns{gap:22px}

  }
  /* ---------- Телефон: приложение с нижними вкладками ---------- */
  @media (max-width:760px){
    :root{--tab:64px}

    .app{grid-template-columns:1fr}

    .search{margin:0 0 22px;max-width:none}
    .search input{padding:13px 14px 13px 40px;font-size:16px;border-radius:14px}
    .search svg{left:14px}
    .hero{padding:4px 0 20px}
    .hero h1{font-size:34px}
    .hero p{font-size:14px;margin:8px 0 16px}
    .hero .btn{padding:12px 22px}
    h2{font-size:22px}
    .section{font-size:17px;margin-bottom:10px}
    .ph{flex-direction:column;align-items:center;text-align:center;gap:14px;margin-bottom:18px}
    .ph h2{font-size:24px}
    .ph .cover,.ph .avatar{width:210px;height:210px}
    .ph .acts{justify-content:center}
    .row{grid-template-columns:50px 1fr auto;gap:12px;padding:8px}
    .list.chart .row{grid-template-columns:24px 50px 1fr auto}
    .rank{font-size:15px}
    .rank.top{font-size:18px}
    .thumb{width:50px;height:50px}
    .dur{display:none}
    .act{gap:4px}
    .act button{width:36px;height:36px;opacity:1}
    .act svg{width:17px;height:17px}
    .t{font-size:15px}
    .a{font-size:13px}
    .pgrid{grid-template-columns:repeat(2,1fr);gap:16px}

    /* Мини-плеер над вкладками */
    .player{position:fixed;left:10px;right:10px;bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 6px);height:68px;z-index:21;display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:12px;padding:0 12px 0 10px;border:1px solid #2a2a2a;border-radius:20px;background:#141414ee;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 18px 40px #000a}
    .center{display:contents}
    .mini{order:0;width:46px;height:46px;border-radius:12px}
    .np{order:1;min-width:0}
    .ctrl{order:2;width:auto}
    .ctrl .bar,.vol,#prev,#next{display:none}
    .btns{gap:0}
    .btns .main{width:44px;height:44px;background:var(--txt);color:#000}
    .btns .main svg{width:17px;height:17px}
    .np .t{font-size:14px}
    .np .a{font-size:12px}

    /* Нижние вкладки */
    .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:22;height:calc(var(--tab) + env(safe-area-inset-bottom,0px));padding:6px 6px env(safe-area-inset-bottom,0px);justify-content:space-around;align-items:center;background:#0b0b0bf5;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
    .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#7d7d7d;font-size:10px;font-weight:600;letter-spacing:.01em;transition:color .3s}
    .tabbar .ic{width:54px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .35s var(--ease),transform .35s var(--ease)}
    .tabbar svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .tabbar button.active{color:#fff}
    .tabbar button.active .ic{background:#ffffff1f;transform:translateY(-1px)}
    .tabbar button:active .ic{transform:scale(.92)}

    /* Полноэкранный плеер на телефоне */
    .full{padding:calc(env(safe-area-inset-top,0px) + 60px) 22px calc(env(safe-area-inset-bottom,0px) + 28px)}
    .full .close{top:calc(env(safe-area-inset-top,0px) + 14px);left:18px}
    .full .lyr-btn{top:calc(env(safe-area-inset-top,0px) + 14px);right:18px}
    .full .big{width:min(78vw,52vh);height:min(78vw,52vh)}
    .full .ti h3{font-size:22px}
    .full .btns{gap:26px}
    .full .btns .main{width:64px;height:64px}
    .lyrics p{font-size:18px}
    .list.chart .row{grid-template-columns:24px 50px 1fr auto}
    .toast{left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);max-width:none}
    .sx{padding:20px}
    .sx-close{top:calc(env(safe-area-inset-top,0px) + 14px)}
    #sxInput{font-size:26px}
  }
  /* ---------- Мини-плеер на телефоне (финальные правила, перекрывают старые) ---------- */
  @media (max-width:760px){
    .player{position:fixed !important;left:10px;right:10px;bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 6px);height:68px !important;padding:0 12px 0 10px !important;border:1px solid #2a2a2a;border-radius:20px;background:#161616f2;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 18px 40px #000a;display:grid !important;grid-template-columns:46px minmax(0,1fr) auto !important;gap:12px !important;align-items:center;z-index:21}
    .center{display:contents !important}
    .mini{display:block !important;order:0;width:46px;height:46px;border-radius:12px;background:var(--surface2) center/cover;box-shadow:0 6px 16px #0008}
    .np{order:1;min-width:0;display:block}
    .np > div{min-width:0}
    .np .t{font-size:14px;font-weight:700}
    .np .a{font-size:12px;margin-top:2px}
    .ctrl{order:2;width:auto !important;gap:0;display:flex}
    .ctrl .bar,.vol,#prev,#next{display:none !important}
    .btns{display:flex;gap:0;justify-content:center}
    .btns .main{width:44px;height:44px;background:var(--txt);color:#000}
    .btns .main svg{width:17px;height:17px}
  }
  /* ---------- Телефон: плеер у самого низа, вкладки над ним ---------- */
  @media (max-width:760px){
    .player{bottom:calc(env(safe-area-inset-bottom,0px) + 10px) !important;height:64px !important;left:10px !important;right:10px !important}
    .tabbar{left:10px !important;right:10px !important;bottom:calc(env(safe-area-inset-bottom,0px) + 82px) !important;height:64px !important;padding:4px 6px !important;border:1px solid #2a2a2a !important;border-radius:20px;background:#0e0e0ef5 !important;box-shadow:0 18px 40px #000a}
  }

  /* ---------- Профиль, авторизация, админка ---------- */
  .search{margin-right:58px}
  .me-btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);right:22px;z-index:18;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;background:linear-gradient(135deg,#3a3a3a,#171717);border:1px solid #ffffff22;transition:transform .35s var(--ease),box-shadow .35s}
  .me-btn:hover{transform:scale(1.1);box-shadow:0 0 0 5px #ffffff14}
  .me-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
  .pf-bg{position:fixed;inset:0;z-index:40;background:#000a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
  .pf-bg.open{opacity:1;pointer-events:auto}
  .pf{position:fixed;top:12px;right:12px;bottom:12px;width:min(390px,calc(100% - 24px));z-index:41;border-radius:30px;background:linear-gradient(180deg,#1b1b1b,#0e0e0e);border:1px solid #ffffff1f;box-shadow:-30px 0 90px #000c;padding:30px 24px;overflow-y:auto;scrollbar-width:none;transform:translateX(calc(100% + 40px)) scale(.94);opacity:0;pointer-events:none;transition:transform .7s cubic-bezier(.16,1,.3,1),opacity .4s}
  .pf.open{transform:none;opacity:1;pointer-events:auto}
  .pf .st{opacity:0}
  .pf.open .st{animation:pfIn .8s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*85ms + 200ms)}
  @keyframes pfIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pf-x{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;background:#ffffff12;font-size:20px;line-height:1;transition:transform .4s var(--ease),background .25s;z-index:2}
  .pf-x:hover{transform:rotate(90deg);background:#ffffff24}
  .pf-ava{width:92px;height:92px;border-radius:50%;margin:14px auto 16px;display:grid;place-items:center;font-size:40px;font-weight:800;position:relative;background:linear-gradient(135deg,hsl(var(--h) 70% 55%),hsl(calc(var(--h) + 50) 70% 35%))}
  .pf-ava::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(hsl(var(--h) 90% 65%),transparent 65%,hsl(var(--h) 90% 65%));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));animation:spin 6s linear infinite}
  .pf-name{text-align:center;font-weight:800;font-size:24px;letter-spacing:-.5px}
  .pf-role{text-align:center;color:var(--muted);font-size:12px;margin-top:4px}
  .pf-time{margin:26px auto 10px;position:relative;width:200px;height:200px}
  .pf-time svg{width:100%;height:100%;transform:rotate(-90deg)}
  .pf-time circle{fill:none;stroke-width:7;stroke-linecap:round}
  .pf-time .bg{stroke:#ffffff10}
  .pf-time .fg{stroke:hsl(var(--h) 85% 62%);stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1.8s cubic-bezier(.16,1,.3,1) .6s;filter:drop-shadow(0 0 7px hsl(var(--h) 90% 60% / .65))}
  .pf-time .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .pf-time b{font-size:52px;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
  .pf-time b small{font-size:18px;letter-spacing:0;color:var(--muted);margin-left:3px;font-weight:600}
  .pf-time span{font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
  .pf-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
  .pf-stat{background:#ffffff08;border:1px solid #ffffff10;border-radius:16px;padding:14px 6px;text-align:center}
  .pf-stat b{display:block;font-size:20px}
  .pf-stat span{font-size:11px;color:var(--muted)}
  .pf-btn{display:block;width:100%;margin-top:10px;padding:14px;border-radius:14px;background:#ffffff10;font-weight:600;font-size:14px;transition:background .25s,transform .25s}
  .pf-btn:hover{background:#ffffff1c;transform:translateY(-1px)}
  .pf-btn.pri{background:var(--txt);color:#000}
  .pf-btn.red{color:#d97070}
  .pf-tabs{display:grid;grid-template-columns:1fr 1fr;background:#ffffff0c;border-radius:999px;padding:4px;margin:40px 0 24px}
  .pf-tabs button{padding:10px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);transition:background .3s,color .3s}
  .pf-tabs button.on{background:var(--txt);color:#000}
  .pf-h{font-size:26px;font-weight:800;letter-spacing:-.6px}
  .pf-p{color:var(--muted);font-size:13px;margin-top:6px}
  .pf-in{width:100%;padding:13px 16px;margin-bottom:10px;border-radius:14px;background:#ffffff0a;border:1px solid #ffffff14;outline:0;font-size:14px;transition:border-color .25s,background .25s}
  .pf-in:focus{border-color:#ffffff44;background:#ffffff10}
  .pf-err{color:#e07070;font-size:13px;min-height:18px;margin:2px 0 8px}
  .ad{display:grid;gap:22px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .ad-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
  .ad-card h4{font-size:15px;margin-bottom:14px}

  .ad-chips button{padding:7px 14px;border-radius:999px;background:var(--surface2);font-size:13px;color:var(--muted);transition:background .25s,color .25s}
  .ad-chips button.on{background:var(--txt);color:#000}
  .ad-t{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:10px}
  .ad-t i{width:38px;height:38px;border-radius:8px;background:var(--surface2) center/cover;flex:none}
  .ad-t div{flex:1;min-width:0}
  .ad-t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .ad-t button{min-width:30px;height:30px;padding:0 10px;border-radius:999px;background:var(--surface2);flex:none;font-size:12px}
  @media (max-width:900px){.ad{grid-template-columns:1fr}}
  @media (max-width:760px){.search{margin-right:0}.me-btn{right:14px;top:calc(env(safe-area-inset-top,0px) + 12px)}.pf{top:8px;right:8px;bottom:8px;width:calc(100% - 16px)}}
</style>
</head>
<body>

<div class="app">
  <aside>
    <div class="brand"><b>W</b><span>ave</span></div>
    <nav class="nav" id="nav">
      <button data-go="home">
        <svg viewBox="0 0 24 24"><path d="M3 12h2l2-6 3 12 3-9 2 6h6"/></svg><span>Главная</span></button>
      <button data-go="wave">
        <svg viewBox="0 0 24 24"><path d="M12 3v18M7 8v8M17 8v8M3 11v2M21 11v2"/></svg><span>Моя волна</span></button>
      <button data-go="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Поиск</span></button>
      <button data-go="trends">
        <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><span>Тренды</span></button>
      <button data-go="likes">
        <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.6-9.2C.9 8.2 2.8 4.5 6.6 4.5c2.3 0 3.8 1.3 5.4 3.1 1.6-1.8 3.1-3.1 5.4-3.1 3.8 0 5.7 3.7 4.2 6.8-2.1 4.6-9.6 9.2-9.6 9.2z"/></svg><span>Избранное</span></button>
      <div class="pl-wrap">
        <div class="label"><span>Плейлисты</span><button class="plus" id="newPl" title="Новый плейлист">+</button></div>
        <div id="plList"></div>
      </div>
      <button data-go="library">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Библиотека</span></button>
    </nav>
  </aside>

  <main>
    <form class="search" id="sf">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Исполнители, треки, альбомы" autocomplete="off">
    </form>
    <div id="content"></div>
  </main>
</div>

<div class="player">
  <div class="np">
    <div style="min-width:0">
      <div class="t" id="nowTitle">Ничего не играет</div>
      <div class="a" id="nowArtist">Выберите трек</div>
    </div>
  </div>

  <div class="center">
    <div class="mini" id="nowCover"></div>
    <div class="ctrl">
      <div class="btns">
        <button id="prev" title="Назад"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9 12z"/></svg></button>
        <button class="main" id="toggle" title="Играть"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="next" title="Вперед"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l11-6z"/></svg></button>
      </div>
      <div class="bar">
        <span id="cur">0:00</span>
        <input type="range" id="seek" min="0" max="100" step="0.1" value="0">
        <span id="dur">0:00</span>
      </div>
    </div>
  </div>

  <div class="vol">
    <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
  </div>
</div>

<div class="full" id="full">
  <div class="bgimg" id="fBg"></div>
  <div class="shade"></div>
  <button class="close" id="fClose" title="Свернуть">
    <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
  </button>

    </div>
    <div class="ctrl">
      <div class="btns">
        <button id="fPrev" title="Назад"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9 12z"/></svg></button>

        <button id="fNext" title="Вперед"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l11-6z"/></svg></button>

        <span id="fDur">0:00</span>
      </div>
    </div>
  </div>
</div>

<div class="sx" id="sx">
  <div class="sx-bg"></div>
  <button class="sx-close" id="sxClose" title="Закрыть">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <form class="sx-inner" id="sxForm">
    <div class="sx-kicker">Поиск</div>
    <input id="sxInput" type="search" placeholder="Исполнители, треки, альбомы" autocomplete="off">
    <div class="sx-hint">Enter — найти &nbsp;·&nbsp; Esc — закрыть</div>
  </form>
</div>

<div class="modal-bg" id="modal">
  <form class="modal" id="modalForm">
    <h3>Новый плейлист</h3>
    <input id="plName" maxlength="40" placeholder="Название" autocomplete="off">
    <div class="mbtns">
      <button type="button" class="btn ghost" data-close>Отмена</button>
      <button type="submit" class="btn">Создать</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>
<nav class="tabbar" id="tabbar">
  <button data-go="home"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 12h2l2-6 3 12 3-9 2 6h6"/></svg></span><span>Главная</span></button>
  <button data-go="wave"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v18M7 8v8M17 8v8M3 11v2M21 11v2"/></svg></span><span>Волна</span></button>
  <button data-go="trends"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></span><span>Тренды</span></button>
  <button data-go="likes"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.6-9.2C.9 8.2 2.8 4.5 6.6 4.5c2.3 0 3.8 1.3 5.4 3.1 1.6-1.8 3.1-3.1 5.4-3.1 3.8 0 5.7 3.7 4.2 6.8-2.1 4.6-9.6 9.2-9.6 9.2z"/></svg></span><span>Избранное</span></button>
  <button data-go="library"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span><span>Библиотека</span></button>
</nav>
<input type="file" id="coverInput" accept="image/*" hidden>
<button class="me-btn" id="meBtn" title="Профиль"></button>
<div class="pf-bg" id="pfBg"></div>
<div class="pf" id="pf"><button class="pf-x" id="pfX" title="Закрыть">×</button><div id="pfBody"></div></div>
<audio id="audio" preload="none"></audio>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const audio = new Audio();
audio.volume = 0.8;

const I_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const I_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const HEART_SVG = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.6-9.2C.9 8.2 2.8 4.5 6.6 4.5c2.3 0 3.8 1.3 5.4 3.1 1.6-1.8 3.1-3.1 5.4-3.1 3.8 0 5.7 3.7 4.2 6.8-2.1 4.6-9.6 9.2-9.6 9.2z"/></svg>';

let queue = [];         // треки открытой страницы
let playQueue = [];     // очередь текущего воспроизведения
let currentId = null;   // id играющего трека
let pendingSeek = 0;    // позиция, куда перемотать после загрузки трека
let restoredTime = 0;   // позиция трека, восстановленного после перезагрузки
let loadId = 0;         // защита от гонки запросов страниц
let playToken = 0;      // защита от гонки запросов потока: играет только последний выбранный трек
let lastLoad = null;    // последний путь загрузки (для кнопки «Повторить»)
let view = { type: 'home' };
let playlists = JSON.parse(localStorage.getItem('wave.playlists') || '[]');
let likes = JSON.parse(localStorage.getItem('wave.likes') || '[]');

function savePlaylists() {
  try { localStorage.setItem('wave.playlists', JSON.stringify(playlists)); }
  catch (e) { toast('Не хватает места в хранилище. Удалите фото у некоторых плейлистов.'); }
}
const saveLikes = () => localStorage.setItem('wave.likes', JSON.stringify(likes));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const fmt = (sec) => (!isFinite(sec) || sec < 0) ? '0:00' : `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
const bg = (url) => url ? `background-image:url('${esc(url)}')` : '';
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = 'none'), 3500);
}

// Запрос с таймаутом: если сервер молчит, пользователь получает ошибку, а не вечную загрузку
async function api(path) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    const r = await fetch(path, { signal: ctrl.signal });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `Ошибка ${r.status}`);
    return data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Сервер долго не отвечает. Попробуйте ещё раз.');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

// ---------- Рендер ----------
function setPage(head) {
  loadId++; // незавершённые загрузки старой страницы больше не применятся
  const c = $('#content');
  c.style.animation = 'none';
  void c.offsetWidth;
  c.style.animation = '';
  c.innerHTML = head + '<div id="body"></div>';
}
const setBody = (html) => { $('#body').innerHTML = html; };

// Строка исполнителей: кликабельные имена
function artistLinks(t) {
  if (typeof t.artists === 'string') return esc(t.artists);
  return (t.artists || []).map((a) => `<span class="link" data-artist="${esc(a.id)}">${esc(a.name)}</span>`).join(', ');
}

function row(t, i) {
  const liked = isLiked(t.id);
  const extra = view.type === 'playlist'
    ? '<button data-act="remove" title="Убрать из плейлиста">×</button>'
    : view.type === 'likes' ? '' : '<button data-act="add" title="Добавить в плейлист">+</button>';
  return `
    <div class="row" data-i="${i}" data-id="${esc(t.id)}" style="animation-delay:${Math.min(i, 25) * 25}ms">${view.type === 'trends' ? `<div class="rank${i < 3 ? ' top' : ''}">${String(i + 1).padStart(2, '0')}</div>` : ''}
      <div class="thumb" style="${bg(t.cover)}">
        <div class="ov">${I_PLAY}</div>
        <div class="eq"><span></span><span></span><span></span></div>
      </div>
      <div class="meta">
        <div class="t">${esc(t.title)}</div>
        <div class="a">${artistLinks(t)}</div>
      </div>
      <div class="dur">${fmt(t.duration / 1000)}</div>
      <div class="act"><button class="like${liked ? ' on' : ''}" data-act="like" title="Нравится">${HEART_SVG}</button>${extra}</div>
    </div>`;
}

function renderTracks(tracks) {
  queue = tracks;
  if (!tracks.length) {
    setBody(`<p class="sub">${view.type === 'playlist' ? 'В плейлисте пока пусто. Добавляйте треки кнопкой «+».' : view.type === 'likes' ? 'Здесь появятся треки, которые вы лайкнули ♥' : 'Ничего не найдено'}</p>`);
    return;
  }
  setBody(`<div class="list${view.type === 'trends' ? ' chart' : ''}">${tracks.map(row).join('')}</div>`);
  markPlaying();
}

// Загружает список треков в текущую страницу, не запуская воспроизведение
async function load(path) {
  lastLoad = path;
  const my = ++loadId;
  setBody('<p class="sub">Загрузка…</p>');
  try {
    const { tracks } = await api(path);
    if (my !== loadId) return;
    renderTracks(tracks || []);
  } catch (e) {
    if (my !== loadId) return;
    setBody(`<p class="sub">${esc(e.message)}</p>
      <div class="acts" style="margin-top:14px"><button class="btn ghost" data-retry>Повторить</button></div>`);
  }
}

// ---------- Страницы ----------
function showHome() {
  view = { type: 'home' };
  setActive('home');
  setPage(`
    <div class="hero">
      <h1>Добро пожаловать</h1>
      <p>Слушайте музыку и собирайте свои плейлисты</p>
      <button class="btn" data-wave>${I_PLAY} Моя волна</button>
    </div>
    <div id="fpBox"></div>
    <div class="section">Популярное</div>`);
  load('/api/search?q=' + enc('хиты 2026'));
  loadFeatured();
}

function showWave() {
  view = { type: 'wave' };
  setActive('wave');
  const q = pick(['synthwave', 'lofi hip hop', 'deep house', 'indie pop', 'phonk', 'jazz']);
  setPage(`
    <div class="ph"><div>
      <h2>Моя волна</h2>
      <div class="sub">Подборка: ${esc(q)}</div>
      <div class="acts"><button class="btn" data-play-all>${I_PLAY} Слушать</button></div>
    </div></div>`);
  load('/api/search?q=' + enc(q));
}

function showSearch(q) {
  view = { type: 'search' };
  setActive('search');
  setPage(`<div class="ph"><div><h2>Поиск</h2><div class="sub">«${esc(q)}»</div></div></div>`);
  load('/api/search?q=' + enc(q));
}

function showTrends() {
  view = { type: 'trends' };
  setActive('trends');
  setPage(`
    <div class="ph"><div>
      <h2>Топ-чарт</h2>
      <div class="sub">Россия</div>
    </div></div>`);
  load('/api/chart?option=russia');
}

async function showArtist(id) {
  view = { type: 'artist' };
  setActive(null);
  setPage('<p class="sub" style="margin-top:8px">Загрузка…</p>');
  const my = loadId;
  try {
    const { artist, tracks } = await api('/api/artist?id=' + enc(id));
    if (my !== loadId) return;
    setPage(`
      <div class="ph">
        <div class="avatar" style="${bg(artist.cover)}"></div>
        <div>
          <div class="kicker">Исполнитель</div>
          <h2>${esc(artist.name)}</h2>
          <div class="sub">${tracks.length} треков</div>
          <div class="acts"><button class="btn" data-play-all>${I_PLAY} Слушать</button><button class="btn ghost" data-shuffle>Перемешать</button></div>
        </div>
      </div>
      <div class="section">Все треки · популярные сверху</div>`);
    renderTracks(tracks || []);
  } catch (e) {
    if (my !== loadId) return;
    setPage(`<p class="sub">${esc(e.message)}</p>
      <div class="acts" style="margin-top:14px"><button class="btn ghost" data-retry>Повторить</button></div>`);
    lastLoad = '/api/artist?id=' + enc(id);
  }
}

function showPlaylist(id) {
  const pl = playlists.find((p) => p.id === id);
  if (!pl) return showHome();
  view = { type: 'playlist', plId: id };
  setActive('pl:' + id);
  setPage(`
    <div class="ph">
      <div class="cover" data-cover title="Изменить фото" style="${bg(pl.cover || pl.tracks[0]?.cover)}"></div>
      <div>
        <div class="kicker">Плейлист</div>
        <h2>${esc(pl.name)}</h2>
        <div class="sub">${pl.tracks.length} треков</div>
        <div class="acts">
          <button class="btn" data-play-all ${pl.tracks.length ? '' : 'disabled'}>${I_PLAY} Слушать</button>
          <button class="btn danger" data-del>Удалить</button>
        </div>
      </div>
    </div>`);
  renderTracks(pl.tracks);
}

// ---------- Воспроизведение ----------
function setPlayIcon() {
  $('#toggle').innerHTML = audio.paused ? I_PLAY : I_PAUSE;
}

function markPlaying() {
  $$('.row').forEach((r) => r.classList.toggle('playing', r.dataset.id === currentId));
}

function showNowTrack(t) {
  $('#nowTitle').textContent = t.title;
  $('#nowArtist').textContent = typeof t.artists === 'string' ? t.artists : (t.artists || []).map((a) => a.name).join(', ');
  $('#nowCover').style.cssText = bg(t.cover);
}

// Сохраняет текущий трек, очередь, позицию и громкость в браузере
function saveState(force) {
  const now = Date.now();
  if (!force && now - (saveState.last || 0) < 3000) return;
  saveState.last = now;
  localStorage.setItem('wave.state', JSON.stringify({
    list: playQueue.slice(0, 200),
    currentId,
    time: audio.src ? audio.currentTime : restoredTime,
    vol: audio.volume,
  }));
}

// Восстанавливает последний трек при открытии сайта (без автозапуска)
function restoreState() {
  try {
    const s = JSON.parse(localStorage.getItem('wave.state') || 'null');
    if (!s || !s.currentId || !Array.isArray(s.list)) return;
    const t = s.list.find((x) => x.id === s.currentId);
    if (!t) return;
    playQueue = s.list;
    currentId = s.currentId;
    restoredTime = s.time || 0;
    showNowTrack(t);
    $('#cur').textContent = fmt(restoredTime);
    if (s.vol != null) {
      audio.volume = s.vol;
      $('#vol').value = s.vol;
      $('#vol').style.setProperty('--p', s.vol * 100 + '%');
    }
  } catch (e) { /* повреждённые данные игнорируем */ }
}

async function play(i, seek = 0, list = queue) {
  if (i < 0 || i >= list.length) return;
  const my = ++playToken;          // новый запрос отменяет все предыдущие
  audio.pause();                   // старый трек сразу останавливается
  playQueue = list;
  const t = list[i];
  currentId = t.id;
  pendingSeek = seek;
  showNowTrack(t);
  markPlaying();
  saveState(true);
  try {
    const { url } = await api('/api/stream?id=' + enc(t.id));
    if (my !== playToken) return;  // пользователь уже выбрал другой трек
    audio.src = url;
    await audio.play();
  } catch (e) {
    if (my === playToken) toast('Не удалось воспроизвести: ' + e.message);
  }
}

const currentIndex = () => playQueue.findIndex((t) => t.id === currentId);

$('#toggle').onclick = () => {
  if (!currentId) return queue.length && play(0);
  // после перезагрузки трек восстановлен, но не загружен: загружаем с сохранённой позиции
  if (!audio.src) return play(playQueue.findIndex((t) => t.id === currentId), restoredTime, playQueue);
  audio.paused ? audio.play() : audio.pause();
};
$('#next').onclick = () => playQueue.length && play((currentIndex() + 1) % playQueue.length, 0, playQueue);
$('#prev').onclick = () => {
  if (!playQueue.length) return;
  const i = currentIndex();
  play(i <= 0 ? playQueue.length - 1 : i - 1, 0, playQueue);
};
audio.onended = () => $('#next').onclick();
audio.onplay = () => { setPlayIcon(); document.body.classList.remove('paused'); };
audio.onpause = () => { setPlayIcon(); document.body.classList.add('paused'); saveState(true); };
audio.addEventListener('loadedmetadata', () => {
  if (pendingSeek) { audio.currentTime = pendingSeek; pendingSeek = 0; }
});

audio.ontimeupdate = () => {
  const p = (audio.currentTime / audio.duration) * 100 || 0;
  $('#seek').value = p;
  $('#seek').style.setProperty('--p', p + '%');
  $('#cur').textContent = fmt(audio.currentTime);
  $('#dur').textContent = fmt(audio.duration);
  saveState(false);
};
$('#seek').oninput = (e) => {
  if (isFinite(audio.duration)) audio.currentTime = (e.target.value / 100) * audio.duration;
};
$('#vol').oninput = (e) => {
  audio.volume = e.target.value;
  e.target.style.setProperty('--p', e.target.value * 100 + '%');
  saveState(true);
};
$('#vol').style.setProperty('--p', '80%');
window.addEventListener('beforeunload', () => saveState(true));

// ---------- Плейлисты ----------
function renderPlaylists() {
  $('#plList').innerHTML = playlists.length
    ? playlists.map((p) => `<button data-pl="${esc(p.id)}">${esc(p.name)}</button>`).join('')
    : '<div class="empty">Плейлистов пока нет</div>';
  setActive(view.type === 'playlist' ? 'pl:' + view.plId : view.type);
}

function addTrackTo(plId, track) {
  const pl = playlists.find((p) => p.id === plId);
  if (!pl) return;
  if (pl.tracks.some((t) => t.id === track.id)) return toast(`Уже есть в «${pl.name}»`);
  pl.tracks.push({ id: track.id, title: track.title, artists: track.artists, duration: track.duration, cover: track.cover });
  savePlaylists();
  renderPlaylists();
  toast(`Добавлено в «${pl.name}»`);
}

function removeFromPlaylist(trackId) {
  const pl = playlists.find((p) => p.id === view.plId);
  if (!pl) return;
  pl.tracks = pl.tracks.filter((t) => t.id !== trackId);
  savePlaylists();
  showPlaylist(pl.id);
}

function deletePlaylist() {
  const pl = playlists.find((p) => p.id === view.plId);
  if (!pl || !confirm(`Удалить плейлист «${pl.name}»?`)) return;
  playlists = playlists.filter((p) => p.id !== pl.id);
  savePlaylists();
  renderPlaylists();
  showHome();
}

let modalCb = null;
function openModal(cb) {
  modalCb = cb;
  $('#plName').value = '';
  $('#modal').classList.add('open');
  setTimeout(() => $('#plName').focus(), 50);
}
function closeModal() {
  $('#modal').classList.remove('open');
  modalCb = null;
}
$('#modal').onclick = (e) => {
  if (e.target.id === 'modal' || e.target.hasAttribute('data-close')) closeModal();
};
$('#modalForm').onsubmit = (e) => {
  e.preventDefault();
  const name = $('#plName').value.trim();
  if (!name) return;
  const pl = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, tracks: [] };
  playlists.push(pl);
  savePlaylists();
  const cb = modalCb;
  closeModal();
  renderPlaylists();
  if (cb) cb(pl); else showPlaylist(pl.id);
};

let popEl = null;
function closePopover() {
  if (popEl) popEl.remove();
  popEl = null;
  document.removeEventListener('click', onDocClick, true);
}
function onDocClick(e) {
  if (popEl && !popEl.contains(e.target)) closePopover();
}
function openPopover(anchor, track) {
  closePopover();
  const pop = document.createElement('div');
  pop.className = 'pop';
  pop.innerHTML = playlists.length
    ? playlists.map((p) => `<button data-pid="${esc(p.id)}">${esc(p.name)} <span>${p.tracks.length}</span></button>`).join('')
    : '<div class="empty">Плейлистов пока нет</div>';
  pop.insertAdjacentHTML('beforeend', '<button class="new" data-new>+ Новый плейлист</button>');
  document.body.appendChild(pop);

  const r = anchor.getBoundingClientRect();
  const h = pop.offsetHeight;
  pop.style.left = Math.max(12, Math.min(r.left - 180, innerWidth - pop.offsetWidth - 12)) + 'px';
  pop.style.top = (r.bottom + h + 8 > innerHeight ? r.top - h - 6 : r.bottom + 6) + 'px';
  popEl = pop;

  pop.onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    closePopover();
    if (b.hasAttribute('data-new')) openModal((pl) => addTrackTo(pl.id, track));
    else addTrackTo(b.dataset.pid, track);
  };
  setTimeout(() => document.addEventListener('click', onDocClick, true), 0);
}

// ---------- Навигация ----------
function setActive(key) {
  $$('#nav button, #tabbar button').forEach((b) => b.classList.toggle('active', b.dataset.go === key));
  $$('#plList button').forEach((b) => b.classList.toggle('active', 'pl:' + b.dataset.pl === key));
}

function route(go) {
  if (go === 'home') showHome();
  else if (go === 'wave') showWave();
  else if (go === 'trends') showTrends();
  else if (go === 'likes') showLikes();
  else if (go === 'library') showLibrary();
  else if (go === 'search') openSearch();
}
$('#nav').onclick = (e) => {
  const b = e.target.closest('button');
  if (b && b.dataset.go) route(b.dataset.go);
};
$('#tabbar').onclick = (e) => {
  const b = e.target.closest('button');
  if (b) route(b.dataset.go);
};

$('#plList').onclick = (e) => {
  const b = e.target.closest('button');
  if (b) showPlaylist(b.dataset.pl);
};
$('#newPl').onclick = () => openModal(null);

$('#sf').onsubmit = (e) => {
  e.preventDefault();
  const q = $('#q').value.trim();
  if (q) showSearch(q);
};

// Один обработчик на всю страницу
$('#content').addEventListener('click', (e) => {
  if (e.target.closest('[data-retry]')) return load(lastLoad);
  const go = e.target.closest('[data-go]');
  if (go) return route(go.dataset.go);
  const fpc = e.target.closest('[data-fp]');
  if (fpc) return showFeatured(fpc.dataset.fp);
  const plCard = e.target.closest('[data-pl]');
  if (plCard) return showPlaylist(plCard.dataset.pl);
  if (e.target.closest('[data-newpl]')) return openModal(null);
  if (e.target.closest('[data-shuffle]')) return play(Math.floor(Math.random() * queue.length));
  if (e.target.closest('[data-cover]')) return $('#coverInput').click();

  const artist = e.target.closest('[data-artist]');
  if (artist) { e.stopPropagation(); return showArtist(artist.dataset.artist); }

  const row = e.target.closest('.row');
  const act = e.target.closest('[data-act]');
  if (row && act) {
    e.stopPropagation();
    const t = queue[Number(row.dataset.i)];
    if (!t) return;
    const a = act.dataset.act;
    if (a === 'like') return toggleLike(t);
    if (a === 'add') return openPopover(act, t);
    if (a === 'remove') return view.type === 'likes' ? toggleLike(t) : removeFromPlaylist(t.id);
    return;
  }
  if (row) return play(Number(row.dataset.i));
  if (e.target.closest('[data-play-all]')) return play(0);
  if (e.target.closest('[data-del]')) return deletePlaylist();
  if (e.target.closest('[data-wave]')) return showWave();
});

// ---------- Полноэкранный плеер ----------
const fEl = $('#full');

function syncFull() {
  if (!fEl.classList.contains('open')) return;
  if (fEl.classList.contains('lyr')) refreshLyrics();
  const cs = $('#nowCover').style.backgroundImage;
  $('#fCover').style.backgroundImage = cs;
  $('#fBg').style.backgroundImage = cs;
  $('#fTitle').textContent = $('#nowTitle').textContent;
  $('#fArtist').textContent = $('#nowArtist').textContent;
  $('#fLike').classList.toggle('on', isLiked(currentId));
  $('#fToggle').innerHTML = audio.paused ? I_PLAY : I_PAUSE;
  fEl.classList.toggle('paused', audio.paused);
  const p = (audio.currentTime / audio.duration) * 100 || 0;
  $('#fSeek').value = p;
  $('#fSeek').style.setProperty('--p', p + '%');
  $('#fCur').textContent = fmt(audio.currentTime);
  $('#fDur').textContent = fmt(audio.duration);
}
['loadstart', 'play', 'pause', 'timeupdate', 'loadedmetadata', 'ended'].forEach((ev) =>
  audio.addEventListener(ev, syncFull));

function openFull() {

  const big = $('#fCover');

function closeFull() {

}

$('#nowCover').onclick = openFull;
$('.np').onclick = openFull;
$('#fClose').onclick = closeFull;
$('#fToggle').onclick = () => $('#toggle').click();
$('#fPrev').onclick = () => $('#prev').click();
$('#fNext').onclick = () => $('#next').click();
$('#fSeek').oninput = (e) => {
  if (isFinite(audio.duration)) audio.currentTime = (e.target.value / 100) * audio.duration;
};
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFull(); });

// ---------- Текст песни (как в Spotify) ----------
const lyrCache = {};   // кэш текстов по id трека
let lyrTrack = null;   // id трека, для которого показан текст
let lyrLines = [];     // синхронизированные строки: { t, s }

async function loadLyrics(id) {
  if (lyrCache[id]) return lyrCache[id];
  const d = await api('/api/lyrics?id=' + enc(id));
  lyrCache[id] = d;
  return d;
}

function parseLrc(text) {
  const out = [];
  for (const raw of text.split('\n')) {
    const m = raw.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/);
    if (!m) continue;
    const s = m[3].trim();
    if (s) out.push({ t: Number(m[1]) * 60 + Number(m[2]), s });
  }
  return out.sort((a, b) => a.t - b.t);
}

async function refreshLyrics() {
  const box = $('#fLyrics');
  if (!currentId) { box.innerHTML = '<div class="msg">Выберите трек</div>'; return; }
  if (lyrTrack === currentId) return;
  lyrTrack = currentId;
  lyrLines = [];
  box.innerHTML = '<div class="msg">Загружаем текст…</div>';
  try {
    const d = await loadLyrics(currentId);
    if (lyrTrack !== currentId) return; // трек уже сменился
    if (d.lrc) lyrLines = parseLrc(d.lrc);
    if (lyrLines.length) {
      box.innerHTML = lyrLines.map((l, i) => `<p data-i="${i}">${esc(l.s)}</p>`).join('');
      updateLyrics();
    } else if (d.text) {
      box.innerHTML = d.text.split('\n').map((s) => `<p>${esc(s) || '&nbsp;'}</p>`).join('');
    } else {
      box.innerHTML = '<div class="msg">Текст для этого трека не найден</div>';
    }
  } catch (e) {
    if (lyrTrack === currentId) lyrTrack = null;
    box.innerHTML = `<div class="msg">${esc(e.message)}</div>`;
  }
}

function updateLyrics() {
  if (!lyrLines.length || !fEl.classList.contains('lyr')) return;
  const box = $('#fLyrics');
  const ps = box.querySelectorAll('p');
  let cur = -1;
  for (let i = 0; i < lyrLines.length; i++) {
    if (audio.currentTime >= lyrLines[i].t) cur = i; else break;
  }
  ps.forEach((p, i) => {
    p.classList.toggle('on', i === cur);
    p.classList.toggle('past', i < cur);
  });
  if (cur >= 0) {
    const el = ps[cur];
    box.scrollTop = el.offsetTop - box.clientHeight / 2 + el.offsetHeight / 2;
  }
}

$('#fLyrBtn').onclick = () => {
  const on = !fEl.classList.contains('lyr');
  fEl.classList.toggle('lyr', on);
  $('#fLyrBtn').classList.toggle('on', on);
  if (on) refreshLyrics();
};
$('#fLyrics').onclick = (e) => {
  const p = e.target.closest('p[data-i]');
  if (p && isFinite(audio.duration)) audio.currentTime = lyrLines[Number(p.dataset.i)].t;
};
audio.addEventListener('timeupdate', updateLyrics);

// ---------- Избранное ----------
const isLiked = (id) => likes.some((x) => x.id === id);

function markLikes() {
  $$('.row').forEach((r) => {
    const b = r.querySelector('.like');
    if (b) b.classList.toggle('on', isLiked(r.dataset.id));
  });
  $('#fLike').classList.toggle('on', isLiked(currentId));
}

function toggleLike(t) {
  const i = likes.findIndex((x) => x.id === t.id);
  if (i >= 0) {
    likes.splice(i, 1);
    toast('Убрано из избранного');
  } else {
    likes.unshift({ id: t.id, title: t.title, artists: t.artists, duration: t.duration, cover: t.cover });
    toast('Добавлено в избранное');
  }
  saveLikes();
  if (view.type === 'likes') showLikes(); else markLikes();
}

function showLikes() {
  view = { type: 'likes' };
  setActive('likes');
  setPage(`
    <div class="ph">
      <div class="cover heart">${HEART_SVG}</div>
      <div>
        <div class="kicker">Плейлист</div>
        <h2>Избранное</h2>
        <div class="sub">${likes.length} треков</div>
        <div class="acts"><button class="btn" data-play-all ${likes.length ? '' : 'disabled'}>${I_PLAY} Слушать</button></div>
      </div>
    </div>`);
  renderTracks(likes);
}

$('#fLike').onclick = () => {
  const t = playQueue.find((x) => x.id === currentId);
  if (t) toggleLike(t);
};

// ---------- Фото плейлиста ----------
$('#coverInput').onchange = (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  const pl = playlists.find((p) => p.id === view.plId);
  if (!f || !pl || !f.type.startsWith('image/')) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    const side = Math.min(img.width, img.height);
    const c = document.createElement('canvas');
    c.width = c.height = 480;
    c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 480, 480);
    URL.revokeObjectURL(url);
    pl.cover = c.toDataURL('image/jpeg', 0.85);
    savePlaylists();
    showPlaylist(pl.id);
    toast('Фото плейлиста обновлено');
  };
  img.src = url;
};

// ---------- Аккаунт, профиль, подборки, админка ----------
const USER_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>';
let me = null;
const hueOf = (s) => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `Ошибка ${r.status}`);
  return d;
}
function paintMe() {
  const b = $('#meBtn');
  b.innerHTML = me ? esc(me.name[0].toUpperCase()) : USER_SVG;
  b.style.background = me ? `linear-gradient(135deg,hsl(${hueOf(me.name)} 70% 55%),hsl(${hueOf(me.name) + 50} 70% 35%))` : '';
}
async function loadMe() { try { me = (await api('/api/u/me')).user; } catch (_) { me = null; } paintMe(); }

// Учёт времени прослушивания: считаем только реально проигранные секунды
let lsAcc = 0, lsLast = 0;
function flushListen() {
  const s = Math.floor(lsAcc);
  if (!me) { lsAcc = 0; return; }
  if (s < 1) return;
  lsAcc -= s;
  me.listen_sec += s;
  fetch('/api/u/listen', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sec: s }), keepalive: true }).catch(() => {});
}
audio.addEventListener('timeupdate', () => {
  const d = audio.currentTime - lsLast;
  lsLast = audio.currentTime;
  if (!audio.paused && d > 0 && d < 2) lsAcc += d;
  if (lsAcc >= 30) flushListen();
});
['emptied', 'seeked', 'loadedmetadata'].forEach((ev) => audio.addEventListener(ev, () => { lsLast = audio.currentTime; }));
audio.addEventListener('pause', flushListen);
window.addEventListener('pagehide', flushListen);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushListen(); });

// Выдвижной профиль справа
const pfEl = $('#pf'), pfBg = $('#pfBg'), pfBody = $('#pfBody');
function openPf() { flushListen(); renderPf(); pfBg.classList.add('open'); pfEl.classList.add('open'); }
function closePf() { pfBg.classList.remove('open'); pfEl.classList.remove('open'); }
$('#meBtn').onclick = openPf;
pfBg.onclick = closePf;
$('#pfX').onclick = closePf;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePf(); });

function renderPf() {
  if (!me) return renderAuth('login');
  const sec = me.listen_sec || 0, hu = hueOf(me.name);
  const days = Math.max(1, Math.ceil((Date.now() / 1000 - me.created) / 86400));
  pfBody.innerHTML = `
    <div class="st" style="--i:0"><div class="pf-ava" style="--h:${hu}">${esc(me.name[0].toUpperCase())}</div>
      <div class="pf-name">${esc(me.name)}</div><div class="pf-role">${me.admin ? 'Администратор' : 'Слушатель Wave'}</div></div>
    <div class="st" style="--i:1"><div class="pf-time" style="--h:${hu}">
      <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="pfRing" cx="60" cy="60" r="54"/></svg>
      <div class="in"><b><i id="pfH" style="font-style:normal">0</i><small>ч</small></b><span id="pfM">0 мин</span></div></div>
      <p class="pf-p" style="text-align:center">Всего вы слушали музыку</p></div>
    <div class="st" style="--i:2"><div class="pf-stats">
      <div class="pf-stat"><b>${likes.length}</b><span>В избранном</span></div>
      <div class="pf-stat"><b>${playlists.length}</b><span>Плейлистов</span></div>
      <div class="pf-stat"><b>${days}</b><span>${days % 10 === 1 && days % 100 !== 11 ? 'день' : 'дн.'} в Wave</span></div></div></div>
    <div class="st" style="--i:3;margin-top:14px">${me.admin ? '<button class="pf-btn pri" data-pf="admin">Админ-панель</button>' : ''}<button class="pf-btn red" data-pf="out">Выйти</button></div>`;
  const t0 = performance.now() + 500;
  (function tick(now) {
    const k = Math.min(1, Math.max(0, (now - t0) / 1500)), v = sec * (1 - Math.pow(1 - k, 3));
    const H = $('#pfH'), M = $('#pfM');
    if (!H) return;
    H.textContent = Math.floor(v / 3600);
    M.textContent = Math.floor((v % 3600) / 60) + ' мин';
    if (k < 1) requestAnimationFrame(tick);
  })(performance.now());
  requestAnimationFrame(() => requestAnimationFrame(() => { const r = $('#pfRing'); if (r) r.style.strokeDashoffset = 339.3 * (1 - (sec % 3600) / 3600); }));
}

function renderAuth(mode) {
  const reg = mode === 'register';
  pfBody.innerHTML = `
    <div class="st" style="--i:0"><div class="pf-tabs"><button data-pf="login" class="${reg ? '' : 'on'}">Вход</button><button data-pf="register" class="${reg ? 'on' : ''}">Регистрация</button></div></div>
    <form id="authF" autocomplete="on">
      <div class="st" style="--i:1"><div class="pf-h">${reg ? 'Создать аккаунт' : 'С возвращением'}</div>
        <p class="pf-p">${reg ? 'Профиль сохранит время прослушивания' : 'Войдите, чтобы видеть свою статистику'}</p></div>
      <div class="st" style="--i:2;margin-top:20px">
        <input class="pf-in" name="name" placeholder="Имя пользователя" autocomplete="username" required>
        ${reg ? '<input class="pf-in" name="email" type="email" placeholder="Почта (необязательно)" autocomplete="email">' : ''}
        <input class="pf-in" name="password" type="password" placeholder="Пароль" minlength="6" autocomplete="${reg ? 'new-password' : 'current-password'}" required>
        ${reg ? '<input class="pf-in" name="code" id="pfCode" placeholder="Админ-код" style="display:none">' : ''}</div>
      <div class="st" style="--i:3"><div class="pf-err" id="pfErr"></div><button class="pf-btn pri" style="margin-top:0">${reg ? 'Зарегистрироваться' : 'Войти'}</button></div>
    </form>`;
  const f = $('#authF');
  if (reg) f.name.oninput = () => { $('#pfCode').style.display = f.name.value.trim().toLowerCase() === 'bibnaq' ? '' : 'none'; };
  f.onsubmit = async (e) => {
    e.preventDefault();
    try {
      me = (await post('/api/u/' + (reg ? 'register' : 'login'), Object.fromEntries(new FormData(f)))).user;
      paintMe(); renderPf();
    } catch (er) { $('#pfErr').textContent = er.message; }
  };
}
pfEl.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-pf]');
  if (!b) return;
  const a = b.dataset.pf;
  if (a === 'login' || a === 'register') renderAuth(a);
  else if (a === 'admin') { closePf(); showAdmin(); }
  else if (a === 'out') {
    flushListen();
    try { await post('/api/u/logout'); } catch (_) {}
    me = null; paintMe(); renderAuth('login');
  }
});

// Подборки от администратора
async function loadFeatured() {
  try {
    const { playlists: list } = await api('/api/u/featured');
    const box = $('#fpBox');
    if (!box || view.type !== 'home' || !list.length) return;
    const cats = [...new Set(list.map((p) => p.category))];
    box.innerHTML = cats.map((c) => `<div class="section">${esc(c)}</div><div class="pgrid">${list.filter((p) => p.category === c).map((p) =>
      `<button class="pcard" data-fp="${esc(p.id)}"><div class="pc-cover" style="${bg(p.cover)}"></div><div class="pc-name">${esc(p.name)}</div><div class="pc-sub">${p.count} треков</div></button>`).join('')}</div>`).join('');
  } catch (_) { /* база может быть ещё не подключена: главная работает и без неё */ }
}
async function showFeatured(id) {
  const my = ++loadId;
  try {
    const { playlist: p } = await api('/api/u/featured?id=' + enc(id));
    if (my !== loadId) return;
    view = { type: 'featured' };
    setActive('home');
    setPage(`<div class="ph"><div class="cover" style="${bg(p.cover || p.tracks[0]?.cover)}"></div><div>
      <div class="kicker">${esc(p.category)}</div><h2>${esc(p.name)}</h2><div class="sub">${p.tracks.length} треков</div>
      <div class="acts"><button class="btn" data-play-all ${p.tracks.length ? '' : 'disabled'}>${I_PLAY} Слушать</button></div></div></div>`);
    renderTracks(p.tracks);
  } catch (e) { toast(e.message); }
}

// Админ-панель (только для bibnaq)
const CATS = ['Подборка', 'Хип-хоп', 'Рок', 'Поп', 'Электроника', 'Джаз', 'Релакс'];
let adm = { id: null, tracks: [] }, admRes = [], admList = [];
const artistsStr = (t) => (t.artists || []).map((a) => a.name).join(', ');
const adTrack = (t, btn) => `<div class="ad-t"><i style="${bg(t.cover)}"></i><div><b>${esc(t.title)}</b><small>${esc(artistsStr(t))}</small></div>${btn}</div>`;
function drawAdm() {
  $('#admTracks').innerHTML = `<div class="sub" style="margin:4px 0 6px">Треки: ${adm.tracks.length}</div>` +
    adm.tracks.map((t, i) => adTrack(t, `<button data-ad="rm" data-i="${i}">×</button>`)).join('');
  $('#admRes').innerHTML = admRes.map((t, i) => adTrack(t, `<button data-ad="add" data-i="${i}">+</button>`)).join('');
  $('#admList').innerHTML = admList.length ? admList.map((p) =>
    `<div class="ad-t"><i style="${bg(p.cover)}"></i><div><b>${esc(p.name)}</b><small>${esc(p.category)} · ${p.count} треков</small></div><button data-ad="edit" data-id="${esc(p.id)}">Изменить</button><button data-ad="del" data-id="${esc(p.id)}">×</button></div>`).join('')
    : '<div class="sub">Пока пусто</div>';
  $('#admChips').innerHTML = CATS.map((c) => `<button type="button" data-ad="cat" data-c="${esc(c)}" class="${$('#admCat').value === c ? 'on' : ''}">${esc(c)}</button>`).join('');
  $('#admH').textContent = adm.id ? 'Редактирование' : 'Новый плейлист';
}
async function showAdmin() {
  if (!me || !me.admin) return showHome();
  view = { type: 'admin' };
  setActive('admin');
  adm = { id: null, tracks: [] }; admRes = [];
  setPage('<div class="ph"><div><div class="kicker">Администратор</div><h2>Админ-панель</h2><div class="sub">Подборки и плейлисты для всех слушателей</div></div></div>');
  setBody(`<div class="ad" id="adm">
    <div class="ad-card"><h4 id="admH"></h4>
      <input class="pf-in" id="admName" maxlength="60" placeholder="Название (например, Хип-хоп 2026)">
      <div class="ad-chips" id="admChips"></div>
      <input class="pf-in" id="admCat" maxlength="30" value="Подборка" placeholder="Категория">
      <input class="pf-in" id="admCover" placeholder="Ссылка на обложку https://… (необязательно)">
      <div id="admTracks"></div>
      <div class="acts" style="margin-top:14px"><button class="btn" data-ad="save">Сохранить</button><button class="btn ghost" data-ad="new">Сбросить</button></div></div>
    <div style="display:grid;gap:22px;min-width:0">
      <div class="ad-card"><h4>Добавить треки</h4>
        <form id="admSF" style="display:flex;gap:8px"><input class="pf-in" id="admQ" placeholder="Поиск треков" style="margin:0"><button class="btn">Найти</button></form>
        <div id="admRes" style="margin-top:12px"></div></div>
      <div class="ad-card"><h4>Созданные плейлисты</h4><div id="admList"></div></div></div></div>`);
  drawAdm();
  $('#admSF').onsubmit = async (e) => {
    e.preventDefault();
    const q = $('#admQ').value.trim();
    if (!q) return;
    try { admRes = (await api('/api/search?q=' + enc(q))).tracks || []; drawAdm(); } catch (er) { toast(er.message); }
  };
  $('#admCat').oninput = drawAdm;
  try { admList = (await api('/api/u/featured')).playlists; drawAdm(); } catch (er) { toast(er.message); }
  $('#adm').onclick = async (e) => {
    const b = e.target.closest('[data-ad]');
    if (!b) return;
    const a = b.dataset.ad, i = Number(b.dataset.i);
    try {
      if (a === 'cat') { $('#admCat').value = b.dataset.c; drawAdm(); }
      else if (a === 'add') { const t = admRes[i]; if (t && !adm.tracks.some((x) => x.id === t.id)) adm.tracks.push(t); drawAdm(); }
      else if (a === 'rm') { adm.tracks.splice(i, 1); drawAdm(); }
      else if (a === 'new') { showAdmin(); }
      else if (a === 'edit') {
        const { playlist: p } = await api('/api/u/featured?id=' + enc(b.dataset.id));
        adm = { id: p.id, tracks: p.tracks };
        $('#admName').value = p.name; $('#admCat').value = p.category; $('#admCover').value = p.cover || '';
        drawAdm(); $('#admName').scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else if (a === 'del') {
        if (!confirm('Удалить плейлист?')) return;
        await post('/api/u/fp_delete', { id: b.dataset.id });
        admList = admList.filter((p) => String(p.id) !== b.dataset.id); drawAdm();
      } else if (a === 'save') {
        const name = $('#admName').value.trim();
        if (!name) return toast('Введите название');
        await post('/api/u/fp_save', { id: adm.id, name, category: $('#admCat').value, cover: $('#admCover').value.trim(), tracks: adm.tracks });
        toast('Сохранено');
        showAdmin();
      }
    } catch (er) { toast(er.message); }
  };
}

restoreState();
loadMe();
showHome();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
